<header class="app-header mb-3 mb-md-4">
  <div class="d-flex flex-column flex-xl-row align-items-xl-start justify-content-between gap-3 gap-xl-4">
    <div class="header-title d-flex align-items-start gap-2 gap-sm-3">
      <span class="icon-circle bg-primary-subtle text-primary fs-4 mt-1" aria-hidden="true">
        <i class="bi bi-clock-history"></i>
      </span>
      <div class="min-w-0">
        <p class="text-primary fw-bold text-uppercase small letter-spacing mb-1">Controle de horas</p>
        <h1 class="app-title fw-bold mb-1 mb-sm-2">Apontamentos de atividades</h1>
        <p class="text-secondary mb-1 app-subtitle">Acompanhe a carga diária, o acumulado semanal e o desempenho do mês.</p>
        @if (userEmail) {
          <p class="small text-secondary mb-0 text-break">
            <i class="bi bi-person-circle me-1" aria-hidden="true"></i>{{ userEmail }}
          </p>
        }
      </div>
    </div>

    <div class="header-actions row g-2 justify-content-xl-end" aria-label="Ações do banco, administração e backup">
      @if (isAdmin) {
        <div class="col-12 col-sm-auto">
          <button
            class="btn btn-dark w-100 d-inline-flex align-items-center justify-content-center gap-2"
            type="button"
            [disabled]="loading"
            (click)="openAdmin.emit()"
          >
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
            <span>Administração</span>
          </button>
        </div>
      }
      <div class="col-6 col-sm-auto">
        <button
          class="btn btn-primary w-100 d-inline-flex align-items-center justify-content-center gap-2"
          type="button"
          [disabled]="loading"
          (click)="refreshDatabase.emit()"
        >
          <i class="bi" [class.bi-arrow-repeat]="!loading" [class.bi-hourglass-split]="loading" aria-hidden="true"></i>
          <span>Atualizar</span>
        </button>
      </div>
      <div class="col-6 col-sm-auto">
        <label class="btn btn-outline-secondary w-100 mb-0 d-inline-flex align-items-center justify-content-center gap-2" [class.disabled]="loading">
          <i class="bi bi-cloud-upload" aria-hidden="true"></i>
          <span>Importar backup</span>
          <input
            class="visually-hidden"
            type="file"
            accept=".txt,.json,text/plain,application/json"
            [disabled]="loading"
            (change)="onFileSelected($event)"
          />
        </label>
      </div>
      <div class="col-6 col-sm-auto">
        <button
          class="btn btn-outline-secondary w-100 d-inline-flex align-items-center justify-content-center gap-2"
          type="button"
          [disabled]="loading"
          (click)="exportBackup.emit()"
        >
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Exportar backup</span>
        </button>
      </div>
      <div class="col-6 col-sm-auto">
        <button
          class="btn btn-outline-danger w-100 d-inline-flex align-items-center justify-content-center gap-2"
          type="button"
          [disabled]="loading"
          (click)="logout.emit()"
        >
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>

  <div
    class="alert py-2 px-2 px-sm-3 mt-3 mb-0 d-flex align-items-start align-items-sm-center gap-2"
    [class.alert-success]="connected"
    [class.alert-warning]="!connected"
  >
    @if (loading) {
      <span class="spinner-border spinner-border-sm mt-1 mt-sm-0" aria-hidden="true"></span>
    } @else {
      <i
        class="bi mt-1 mt-sm-0"
        [class.bi-database-check]="connected"
        [class.bi-database-exclamation]="!connected"
        aria-hidden="true"
      ></i>
    }
    <span class="small text-break">{{ databaseStatus }}</span>
  </div>
</header>

name: Publicar Angular no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bloquear credenciais administrativas no frontend
        shell: bash
        run: |
          if grep -REIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' --exclude='*.txt' 'sb_[s]ecret_[A-Za-z0-9_-]{20,}' .; then
            echo 'Foi encontrada uma chave administrativa no projeto. Remova-a antes de publicar.'
            exit 1
          fi

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Configurar conexão pública do Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co$ ]]; then
              echo 'SUPABASE_URL inválida.'
              exit 1
            fi

            if [[ ! "$SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_ ]]; then
              echo 'Use somente uma Supabase Publishable key no GitHub Pages.'
              exit 1
            fi

            node <<'NODE'
          const fs = require('node:fs');
          const config = {
            supabaseUrl: process.env.SUPABASE_URL,
            supabasePublishableKey: process.env.SUPABASE_PUBLISHABLE_KEY,
            authRedirectUrl: 'https://dpescador.github.io/apontamentos-angular/',
            localAuthRedirectUrl: 'http://localhost:4200/'
          };
          fs.writeFileSync(
            'public/app-config.js',
            `window.__APP_CONFIG__ = ${JSON.stringify(config, null, 2)};\n`,
            'utf8'
          );
          NODE
          else
            echo 'Repository Variables não informadas; usando a configuração pública versionada em public/app-config.js.'

            if grep -Eq 'SEU-PROJETO|SUA_CHAVE|EXEMPLO' public/app-config.js; then
              echo 'Configure SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY nas Repository Variables.'
              exit 1
            fi
          fi

      - name: Calcular base href
        id: base
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar Angular
        run: npm run build -- --configuration production --base-href "${{ steps.base.outputs.value }}"

      - name: Criar fallback do GitHub Pages
        shell: bash
        run: cp dist/apontamentos-dashboard/browser/index.html dist/apontamentos-dashboard/browser/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apontamentos-dashboard/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
